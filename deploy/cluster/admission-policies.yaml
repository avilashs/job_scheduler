# Cluster-enforced guardrails (ValidatingAdmissionPolicy, admissionregistration.k8s.io/v1, K8s 1.30+).
# They hold even if the scheduler has a bug or is compromised. The submitter evaluates the
# same rules locally before submitting, so violations fail fast with a readable error.
#
# Namespaces opt in with the label jobsched.io/tenant=<name>, which only the Tenant Operator can set.
---
# 1) SparkApplication shape: fixed ServiceAccounts, scheduler-owned retries, required labels.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: jobsched-sparkapplication-guardrails
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - { key: jobsched.io/tenant, operator: Exists }
    resourceRules:
      - apiGroups: ["sparkoperator.k8s.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["sparkapplications"]
  validations:
    - expression: "has(object.spec.driver.serviceAccount) && object.spec.driver.serviceAccount == 'spark-driver'"
      message: "driver must run as ServiceAccount spark-driver"
    - expression: "!has(object.spec.executor.serviceAccount) || object.spec.executor.serviceAccount == 'spark-executor'"
      message: "executors must run as ServiceAccount spark-executor"
    # Scheduler-submitted apps: the scheduler owns retries, so restartPolicy must be Never.
    # Exception (interim, until the scheduler exists): runs the Spark Operator creates from a
    # ScheduledSparkApplication may use bounded operator retries, because nothing else retries them.
    - expression: >-
        has(object.spec.restartPolicy) && (object.spec.restartPolicy.type == 'Never' ||
          (request.userInfo.username.startsWith('system:serviceaccount:spark-operator:') &&
           has(object.metadata.labels) && 'sparkoperator.k8s.io/scheduled-app-name' in object.metadata.labels &&
           object.spec.restartPolicy.type == 'OnFailure' &&
           has(object.spec.restartPolicy.onFailureRetries) && object.spec.restartPolicy.onFailureRetries <= 3 &&
           (!has(object.spec.restartPolicy.onSubmissionFailureRetries) || object.spec.restartPolicy.onSubmissionFailureRetries <= 3)))
      message: "restartPolicy.type must be Never (retries are owned by the scheduler); scheduled runs may use OnFailure with <= 3 retries"
    - expression: >-
        has(object.spec.driver.labels) && 'jobsched.io/attempt-id' in object.spec.driver.labels &&
        has(object.spec.executor.labels) && 'jobsched.io/attempt-id' in object.spec.executor.labels &&
        object.spec.driver.labels['jobsched.io/attempt-id'] == object.spec.executor.labels['jobsched.io/attempt-id']
      message: "driver and executor must carry the same jobsched.io/attempt-id label"
    - expression: "!has(object.spec.volumes) || object.spec.volumes.all(v, !has(v.hostPath))"
      message: "hostPath volumes are not allowed"
    - expression: "has(object.spec.timeToLiveSeconds) && object.spec.timeToLiveSeconds <= 86400"
      message: "timeToLiveSeconds is required (<= 86400) to keep etcd small"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: jobsched-sparkapplication-guardrails
spec:
  policyName: jobsched-sparkapplication-guardrails
  validationActions: ["Deny", "Audit"]
---
# 2) Pod tier ceiling and hygiene. Every pod must name a PriorityClass the namespace's
#    jobsched.io/max-tier allows. This prevents priority inflation and stands in for the
#    ResourceQuota limitedResources flag on managed control planes.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: jobsched-tier-ceiling
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - { key: jobsched.io/tenant, operator: Exists }
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  variables:
    - name: pc
      expression: "has(object.spec.priorityClassName) ? object.spec.priorityClassName : ''"
    - name: maxTier
      expression: >-
        has(namespaceObject.metadata.labels) && 'jobsched.io/max-tier' in namespaceObject.metadata.labels
        ? namespaceObject.metadata.labels['jobsched.io/max-tier'] : 'adhoc'
    - name: allowed
      expression: >-
        {
          'critical': ['jobsched-critical-driver','jobsched-critical-executor',
                       'jobsched-standard-driver','jobsched-standard-executor',
                       'jobsched-adhoc-driver','jobsched-adhoc-executor'],
          'standard': ['jobsched-standard-driver','jobsched-standard-executor',
                       'jobsched-adhoc-driver','jobsched-adhoc-executor'],
          'adhoc':    ['jobsched-adhoc-driver','jobsched-adhoc-executor']
        }
    - name: containers
      expression: "object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : [])"
  validations:
    - expression: "variables.maxTier in variables.allowed && variables.pc in variables.allowed[variables.maxTier]"
      messageExpression: "'priorityClassName \"' + variables.pc + '\" not permitted; namespace max tier is ' + variables.maxTier"
    - expression: >-
        !(has(object.spec.hostNetwork) && object.spec.hostNetwork) &&
        !(has(object.spec.hostPID) && object.spec.hostPID) &&
        !(has(object.spec.hostIPC) && object.spec.hostIPC)
      message: "host namespaces are not allowed"
    - expression: >-
        variables.containers.all(c, !has(c.env) || c.env.all(e,
          !has(e.value) ||
          !(e.name.upperAscii().contains('PASSWORD') || e.name.upperAscii().contains('SECRET') ||
            e.name.upperAscii().contains('TOKEN') || e.name.upperAscii().contains('API_KEY'))))
      message: "secret-like env vars must use valueFrom.secretKeyRef, not literal values"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: jobsched-tier-ceiling
spec:
  policyName: jobsched-tier-ceiling
  validationActions: ["Deny", "Audit"]
---
# 3) The submitter may only create per-attempt NetworkPolicies: they select one attempt-id
#    and allow traffic only to and from pods with that same attempt-id (no namespace/ipBlock peers).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: jobsched-submitter-networkpolicy-shape
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["networking.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["networkpolicies"]
  matchConditions:
    - name: is-submitter
      expression: "request.userInfo.username == 'system:serviceaccount:jobsched-system:jobsched-submitter'"
  variables:
    - name: aid
      expression: >-
        has(object.spec.podSelector.matchLabels) && 'jobsched.io/attempt-id' in object.spec.podSelector.matchLabels
        ? object.spec.podSelector.matchLabels['jobsched.io/attempt-id'] : ''
  validations:
    - expression: "variables.aid != ''"
      message: "submitter NetworkPolicies must select a single jobsched.io/attempt-id"
    - expression: >-
        !has(object.spec.ingress) || object.spec.ingress.all(r, has(r.from) && r.from.all(p,
          has(p.podSelector) && !has(p.namespaceSelector) && !has(p.ipBlock) &&
          has(p.podSelector.matchLabels) && 'jobsched.io/attempt-id' in p.podSelector.matchLabels &&
          p.podSelector.matchLabels['jobsched.io/attempt-id'] == variables.aid))
      message: "ingress peers must be pods of the same attempt"
    - expression: >-
        !has(object.spec.egress) || object.spec.egress.all(r, has(r.to) && r.to.all(p,
          has(p.podSelector) && !has(p.namespaceSelector) && !has(p.ipBlock) &&
          has(p.podSelector.matchLabels) && 'jobsched.io/attempt-id' in p.podSelector.matchLabels &&
          p.podSelector.matchLabels['jobsched.io/attempt-id'] == variables.aid))
      message: "egress peers must be pods of the same attempt"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: jobsched-submitter-networkpolicy-shape
spec:
  policyName: jobsched-submitter-networkpolicy-shape
  validationActions: ["Deny", "Audit"]
---
# 4) The Tenant Operator, the only identity that writes quotas and RBAC, is confined to
#    namespaces labelled as tenants and may bind only the platform's approved roles.
#    It may create or update only namespaces named tenant-*. Without that rule it could
#    label kube-system as a "tenant" and then write RBAC there.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: jobsched-tenant-operator-scope
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["namespaces"]
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["resourcequotas", "limitranges", "serviceaccounts"]
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["rolebindings"]
      - apiGroups: ["networking.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["networkpolicies"]
  matchConditions:
    - name: is-tenant-operator
      expression: "request.userInfo.username == 'system:serviceaccount:jobsched-system:jobsched-tenant-operator'"
  validations:
    - expression: >-
        request.resource.resource == 'namespaces'
          ? object.metadata.name.startsWith('tenant-') &&
            has(object.metadata.labels) && 'jobsched.io/tenant' in object.metadata.labels
          : has(namespaceObject.metadata.labels) && 'jobsched.io/tenant' in namespaceObject.metadata.labels
      message: "tenant operator may only manage tenant-* namespaces and write inside them"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: jobsched-tenant-operator-scope
spec:
  policyName: jobsched-tenant-operator-scope
  validationActions: ["Deny", "Audit"]
---
# 5) RoleBindings written by the Tenant Operator may reference only approved platform ClusterRoles.
#    (Separate from policy 4 so `object.roleRef` type-checks: this policy matches RoleBindings only.)
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: jobsched-tenant-operator-rolebindings
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["rolebindings"]
  matchConditions:
    - name: is-tenant-operator
      expression: "request.userInfo.username == 'system:serviceaccount:jobsched-system:jobsched-tenant-operator'"
  validations:
    - expression: >-
        object.roleRef.kind == 'ClusterRole' &&
        object.roleRef.name in ['jobsched-submitter', 'jobsched-tenant-viewer', 'jobsched-tenant-admin', 'jobsched-spark-driver',
                                 'jobsched-tenant-spark-scheduler']
      message: "rolebinding must reference an approved platform ClusterRole"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: jobsched-tenant-operator-rolebindings
spec:
  policyName: jobsched-tenant-operator-rolebindings
  validationActions: ["Deny", "Audit"]
---
# 6) ScheduledSparkApplication (operator-native cron; the interim way to schedule Spark until the
#    scheduler exists). The operator copies spec.template verbatim into each run, and policy 1 judges
#    the run. This policy checks the same rules when the schedule is CREATED, so a bad template fails
#    at `kubectl apply` rather than silently at 2am. It also bounds frequency, concurrency and history.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: jobsched-scheduledsparkapplication-guardrails
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - { key: jobsched.io/tenant, operator: Exists }
    resourceRules:
      - apiGroups: ["sparkoperator.k8s.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["scheduledsparkapplications"]
  variables:
    - name: t
      expression: "object.spec.template"
  validations:
    - expression: "size(object.metadata.name) <= 30"
      message: "name must be <= 30 characters (each run is named <name>-<19-digit timestamp>)"
    - expression: >-
        !object.spec.schedule.startsWith('@every') &&
        !object.spec.schedule.trim().matches('^(\\*|\\*/[1-4]|0-59)(\\s|$)')
      message: "schedules may run at most every 5 minutes (no '* ...', '*/1-4 ...' or '@every')"
    - expression: "has(object.spec.concurrencyPolicy) && object.spec.concurrencyPolicy in ['Forbid', 'Replace']"
      message: "concurrencyPolicy must be Forbid or Replace (Allow lets runs pile up and exhaust quota)"
    - expression: >-
        (!has(object.spec.successfulRunHistoryLimit) || object.spec.successfulRunHistoryLimit <= 5) &&
        (!has(object.spec.failedRunHistoryLimit) || object.spec.failedRunHistoryLimit <= 5)
      message: "run history limits must be <= 5 to keep etcd small"
    - expression: "has(variables.t.driver.serviceAccount) && variables.t.driver.serviceAccount == 'spark-driver'"
      message: "template.driver must run as ServiceAccount spark-driver"
    - expression: "!has(variables.t.executor.serviceAccount) || variables.t.executor.serviceAccount == 'spark-executor'"
      message: "template.executor must run as ServiceAccount spark-executor"
    - expression: >-
        has(variables.t.restartPolicy) && (variables.t.restartPolicy.type == 'Never' ||
          (variables.t.restartPolicy.type == 'OnFailure' &&
           has(variables.t.restartPolicy.onFailureRetries) && variables.t.restartPolicy.onFailureRetries <= 3 &&
           (!has(variables.t.restartPolicy.onSubmissionFailureRetries) || variables.t.restartPolicy.onSubmissionFailureRetries <= 3)))
      message: "template.restartPolicy must be Never, or OnFailure with onFailureRetries <= 3"
    - expression: >-
        has(variables.t.driver.labels) && 'jobsched.io/attempt-id' in variables.t.driver.labels &&
        has(variables.t.executor.labels) && 'jobsched.io/attempt-id' in variables.t.executor.labels &&
        variables.t.driver.labels['jobsched.io/attempt-id'] == variables.t.executor.labels['jobsched.io/attempt-id']
      message: "template driver and executor must carry the same jobsched.io/attempt-id label"
    - expression: "!has(variables.t.volumes) || variables.t.volumes.all(v, !has(v.hostPath))"
      message: "hostPath volumes are not allowed"
    - expression: "has(variables.t.timeToLiveSeconds) && variables.t.timeToLiveSeconds <= 86400"
      message: "template.timeToLiveSeconds is required (<= 86400)"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: jobsched-scheduledsparkapplication-guardrails
spec:
  policyName: jobsched-scheduledsparkapplication-guardrails
  validationActions: ["Deny", "Audit"]
