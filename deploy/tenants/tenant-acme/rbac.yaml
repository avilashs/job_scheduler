# --- Workload identities -----------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata: { name: spark-driver, namespace: tenant-acme }
automountServiceAccountToken: true        # the driver must manage its executors
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: spark-executor, namespace: tenant-acme }
automountServiceAccountToken: false       # executors never call the apiserver
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: job-runner, namespace: tenant-acme }
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: spark-driver, namespace: tenant-acme }
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete", "deletecollection"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "persistentvolumeclaims"]
    verbs: ["create", "get", "list", "watch", "delete", "deletecollection"]
  # Deliberately absent: secrets, pods/exec, rbac, networkpolicies, any cross-namespace access.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: spark-driver, namespace: tenant-acme }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: spark-driver }
subjects:
  - { kind: ServiceAccount, name: spark-driver, namespace: tenant-acme }
---
# --- Control-plane write access, scoped to THIS namespace only --------------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: jobsched-submitter, namespace: tenant-acme }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: jobsched-submitter }
subjects:
  - { kind: ServiceAccount, name: jobsched-submitter, namespace: jobsched-system }
---
# The Spark Operator shard that owns this namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: spark-operator, namespace: tenant-acme }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: spark-operator-controller }
subjects:
  - { kind: ServiceAccount, name: spark-operator-controller-2, namespace: spark-operator }
---
# --- Humans (OIDC groups). Read-only: every submission goes through the scheduler API. -----
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: tenant-acme-developers, namespace: tenant-acme }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: jobsched-tenant-viewer }
subjects:
  - { kind: Group, name: "oidc:tenant-acme-developers", apiGroup: rbac.authorization.k8s.io }
---
# Break-glass: the access broker adds and removes subjects just-in-time (time-bound).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: tenant-acme-admins, namespace: tenant-acme }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: jobsched-tenant-admin }
subjects: []
