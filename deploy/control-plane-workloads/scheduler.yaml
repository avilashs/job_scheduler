# NOT YET DEPLOYABLE. The scheduler/submitter/syncer/API/trigger implementation and the image
# ghcr.io/avilashs/jobsched do not exist yet; applying this yields ImagePullBackOff.
# It is kept here as the reference shape (HA, zone spread, PDB, probes, hardening) and lives outside
# deploy/control-plane/ so that `kubectl apply -f deploy/control-plane/` stays safe. It also needs
# Secret jobsched-db (key: dsn) in jobsched-system. See docs/DEPLOYMENT.md, step 8.
# Scheduler: active-active over 256 fenced shards (leases in Postgres), spread across zones.
# The submitter, syncer, API and trigger Deployments follow the same pattern with different --mode flags.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobsched-scheduler
  namespace: jobsched-system
  labels: { app.kubernetes.io/name: jobsched, app.kubernetes.io/component: scheduler }
spec:
  replicas: 3
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app.kubernetes.io/name: jobsched, app.kubernetes.io/component: scheduler }
  template:
    metadata:
      labels: { app.kubernetes.io/name: jobsched, app.kubernetes.io/component: scheduler }
    spec:
      serviceAccountName: jobsched-watcher
      priorityClassName: jobsched-control-plane
      terminationGracePeriodSeconds: 30      # graceful shard release
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: { app.kubernetes.io/component: scheduler }
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: scheduler
          image: ghcr.io/avilashs/jobsched:0.1.0
          args:
            - --mode=scheduler,syncer
            - --shards=256
            - --shard-groups=16
            - --lease-ttl=15s
            - --lease-renew=5s
            - --self-fence-after=10s
            - --informer-resync=0s
            - --informer-label-selector=jobsched.io/managed=true
            - --kube-qps=50
            - --kube-burst=100
            - --use-watch-list=true
          env:
            - name: DB_DSN
              valueFrom: { secretKeyRef: { name: jobsched-db, key: dsn } }
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          ports:
            - { name: metrics, containerPort: 9090 }
            - { name: health, containerPort: 8081 }
          readinessProbe:
            httpGet: { path: /readyz, port: health }   # ready only once informers synced and >=1 shard held
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: health }
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: "2", memory: 4Gi }
            limits: { memory: 6Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: jobsched-scheduler
  namespace: jobsched-system
spec:
  minAvailable: 2
  selector:
    matchLabels: { app.kubernetes.io/component: scheduler }
